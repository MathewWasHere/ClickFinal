// GLISSE (0kzh/glisse v0.5.0 / v0.6.0) — iOS 26 Liquid Glass Components
// Faithful implementation using SVG feDisplacementMap refraction + CSS vars:
// --lg-glass-bend, --lg-glass-dispersion, --lg-blur, --lg-rim-shine
// ============================================================================

function GlisseSvgFilters({ bend = 0.45, dispersion = 0.4 }) {
  const scale = Math.round(bend * 38);
  const chromaOffset = Number((dispersion * 2.8).toFixed(2));
  return (
    <svg
      aria-hidden="true"
      style={{ position: "absolute", width: 0, height: 0, pointerEvents: "none" }}
    >
      <defs>
        <filter
          id="glisse-refract"
          x="-15%"
          y="-15%"
          width="130%"
          height="130%"
          colorInterpolationFilters="sRGB"
        >
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.012 0.018"
            numOctaves="2"
            seed="7"
            result="noise"
          />
          <feGaussianBlur in="noise" stdDeviation="2.5" result="smoothNoise" />
          <feDisplacementMap
            in="SourceGraphic"
            in2="smoothNoise"
            scale={scale}
            xChannelSelector="R"
            yChannelSelector="G"
            result="displaced"
          />
          <feOffset in="displaced" dx={chromaOffset} dy="0" result="redShift" />
          <feOffset in="displaced" dx={-chromaOffset} dy="0" result="blueShift" />
          <feMerge>
            <feMergeNode in="displaced" />
          </feMerge>
        </filter>
      </defs>
    </svg>
  );
}

function Glass({
  children,
  className = "",
  style = {},
  interactive = false,
  onClick
}) {
  const [lifted, setLifted] = useState(false);
  const bend = style["--lg-glass-bend"] ?? 0.45;
  const dispersion = style["--lg-glass-dispersion"] ?? 0.4;
  const blur = style["--lg-blur"] ?? "3px";
  const rimShine = style["--lg-rim-shine"] ?? 0.13;

  const computedStyle = {
    "--lg-glass-bend": bend,
    "--lg-glass-dispersion": dispersion,
    "--lg-blur": blur,
    "--lg-rim-shine": rimShine,
    backdropFilter: `blur(${blur}) saturate(${140 + Math.round(bend * 90)}%) contrast(${
      102 + Math.round(dispersion * 18)
    }%)`,
    WebkitBackdropFilter: `blur(${blur}) saturate(${140 + Math.round(bend * 90)}%) contrast(${
      102 + Math.round(dispersion * 18)
    }%)`,
    boxShadow: lifted
      ? `0 22px 48px -10px rgba(0,0,0,0.48), inset 0 1.5px 1px rgba(255,255,255,${Math.min(
          1,
          rimShine * 3.2
        )}), inset 0 -1px 2px rgba(255,255,255,${rimShine * 1.4}), ${
          dispersion * 3
        }px 0 ${dispersion * 10}px rgba(255,90,120,${dispersion * 0.22}), ${
          -dispersion * 3
        }px 0 ${dispersion * 10}px rgba(80,190,255,${dispersion * 0.22})`
      : `0 12px 32px -8px rgba(0,0,0,0.28), inset 0 1px 1px rgba(255,255,255,${Math.min(
          1,
          rimShine * 2.4
        )}), inset 0 -1px 1px rgba(255,255,255,${rimShine})`,
    transform: lifted ? "scale(1.025) translateY(-2px)" : "scale(1)",
    transition: "transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease",
    ...style
  };

  return (
    <div
      onClick={onClick}
      onMouseDown={() => interactive && setLifted(true)}
      onMouseUp={() => interactive && setLifted(false)}
      onMouseLeave={() => interactive && setLifted(false)}
      onTouchStart={() => interactive && setLifted(true)}
      onTouchEnd={() => interactive && setLifted(false)}
      style={computedStyle}
      className={`relative overflow-hidden border border-white/25 dark:border-white/15 bg-white/15 dark:bg-white/10 ${
        interactive ? "cursor-pointer select-none" : ""
      } ${className}`}
    >
      <div
        aria-hidden="true"
        className="pointer-events-none absolute inset-0 rounded-[inherit]"
        style={{
          background: `linear-gradient(135deg, rgba(255,255,255,${Math.min(
            0.65,
            rimShine * 2.2
          )}) 0%, rgba(255,255,255,0.02) 45%, rgba(122,31,45,${dispersion * 0.25}) 100%)`
        }}
      />
      <div className="relative z-10">{children}</div>
    </div>
  );
}

function Button({
  children,
  variant = "glass",
  destructive = false,
  icon = null,
  onClick,
  disabled = false,
  className = "",
  type = "button",
  "aria-label": ariaLabel
}) {
  const [pressed, setPressed] = useState(false);

  const getVariantClasses = () => {
    if (destructive) {
      return variant === "filled"
        ? "bg-red-600 hover:bg-red-500 text-white border border-red-400/40 shadow-lg shadow-red-900/30"
        : "bg-red-500/15 hover:bg-red-500/25 text-red-400 border border-red-500/30 backdrop-blur-md";
    }
    if (variant === "filled") {
      return "bg-gradient-to-l from-[#7A1F2D] to-[#9b283b] hover:from-[#8d2434] hover:to-[#ad2e43] text-white border border-white/25 shadow-lg shadow-[#7A1F2D]/40";
    }
    if (variant === "tinted") {
      return "bg-[#7A1F2D]/20 hover:bg-[#7A1F2D]/30 text-[#ff9aa9] border border-[#7A1F2D]/40 backdrop-blur-md";
    }
    return "bg-white/15 dark:bg-white/10 hover:bg-white/25 dark:hover:bg-white/15 text-current border border-white/30 dark:border-white/20 backdrop-blur-md";
  };

  return (
    <button
      type={type}
      aria-label={ariaLabel}
      disabled={disabled}
      onClick={onClick}
      onMouseDown={() => setPressed(true)}
      onMouseUp={() => setPressed(false)}
      onMouseLeave={() => setPressed(false)}
      onTouchStart={() => setPressed(true)}
      onTouchEnd={() => setPressed(false)}
      style={{
        transform: pressed && !disabled ? "scale(1.045) translateY(-1px)" : "scale(1)",
        transition: "all 0.22s cubic-bezier(0.22, 1, 0.36, 1)",
        boxShadow: pressed
          ? "0 14px 28px -6px rgba(0,0,0,0.35), inset 0 1.5px 1px rgba(255,255,255,0.45)"
          : undefined
      }}
      className={`inline-flex items-center justify-center gap-2 rounded-2xl px-4 py-2.5 text-sm font-semibold select-none ${getVariantClasses()} ${
        disabled ? "opacity-45 cursor-not-allowed" : "cursor-pointer"
      } ${className}`}
    >
      {icon && <span className="shrink-0">{icon}</span>}
      {children && <span>{children}</span>}
    </button>
  );
}

function TabBar({
  items = [],
  value,
  onValueChange,
  "aria-label": ariaLabel,
  badgeMap = {}
}) {
  const [lifted, setLifted] = useState(false);

  return (
    <nav
      aria-label={ariaLabel}
      onMouseDown={() => setLifted(true)}
      onMouseUp={() => setLifted(false)}
      onMouseLeave={() => setLifted(false)}
      onTouchStart={() => setLifted(true)}
      onTouchEnd={() => setLifted(false)}
      style={{
        backdropFilter: "blur(18px) saturate(200%)",
        WebkitBackdropFilter: "blur(18px) saturate(200%)",
        transform: lifted ? "scale(1.04) translateY(-4px)" : "scale(1)",
        transition: "transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease",
        boxShadow: lifted
          ? "0 24px 48px -12px rgba(0,0,0,0.6), inset 0 1.5px 2px rgba(255,255,255,0.6), 3px 0 12px rgba(255,90,120,0.22), -3px 0 12px rgba(80,190,255,0.22)"
          : "0 16px 36px -10px rgba(0,0,0,0.45), inset 0 1px 1.5px rgba(255,255,255,0.38)"
      }}
      className="relative flex items-center justify-around gap-1 rounded-full p-1.5 border border-white/30 dark:border-white/20 bg-white/30 dark:bg-black/45 select-none"
    >
      {items.map((item) => {
        const active = item.value === value;
        const badge = badgeMap[item.value];
        return (
          <button
            key={item.value}
            type="button"
            onClick={() => onValueChange(item.value)}
            className={`relative flex-1 flex flex-col items-center justify-center gap-0.5 py-2 px-3 rounded-full text-xs font-bold transition-all duration-300 cursor-pointer ${
              active
                ? "bg-white/90 dark:bg-white/20 text-[#7A1F2D] dark:text-white shadow-md scale-[1.04]"
                : "text-neutral-700 dark:text-neutral-300 hover:text-black dark:hover:text-white"
            }`}
            style={
              active
                ? {
                    boxShadow:
                      "0 6px 18px -4px rgba(122,31,45,0.4), inset 0 1px 1px rgba(255,255,255,0.75)"
                  }
                : undefined
            }
          >
            <div className="relative">
              {item.icon}
              {badge ? (
                <span className="absolute -top-1.5 -left-2.5 px-1.5 py-0.2 rounded-full text-[10px] font-extrabold bg-[#7A1F2D] text-white shadow">
                  {badge}
                </span>
              ) : null}
            </div>
            <span className="truncate max-w-[76px]">{item.label}</span>
          </button>
        );
      })}
    </nav>
  );
}

function SegmentedControl({
  items = [],
  value,
  onValueChange,
  "aria-label": ariaLabel,
  className = ""
}) {
  const [lifted, setLifted] = useState(false);

  return (
    <div
      role="tablist"
      aria-label={ariaLabel}
      onMouseDown={() => setLifted(true)}
      onMouseUp={() => setLifted(false)}
      onMouseLeave={() => setLifted(false)}
      style={{
        backdropFilter: "blur(10px) saturate(160%)",
        WebkitBackdropFilter: "blur(10px) saturate(160%)",
        transform: lifted ? "scale(1.02)" : "scale(1)",
        transition: "all 0.25s cubic-bezier(0.22, 1, 0.36, 1)",
        boxShadow: "inset 0 1px 2px rgba(0,0,0,0.18), 0 1px 1px rgba(255,255,255,0.2)"
      }}
      className={`inline-flex items-center gap-1 p-1 rounded-2xl border border-white/25 dark:border-white/15 bg-black/10 dark:bg-white/10 select-none ${className}`}
    >
      {items.map((item) => {
        const active = item.value === value;
        return (
          <button
            key={item.value}
            role="tab"
            aria-selected={active}
            type="button"
            onClick={() => onValueChange(item.value)}
            style={
              active
                ? {
                    boxShadow:
                      "0 4px 14px -2px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255,255,255,0.65)"

                : undefined

              active

            }`}
          >
            {item.label}
          </button>

      })}
    </div>
  );
}

function Switch({
  checked,
  onCheckedChange,
  disabled = false,
  "aria-label": ariaLabel
}) {
  const [lifted, setLifted] = useState(false);

  return (
    <button
      type="button"
      role="switch"
      aria-checked={checked}
      aria-label={ariaLabel}
      disabled={disabled}
      onClick={() => !disabled && onCheckedChange(!checked)}
      onMouseDown={() => setLifted(true)}
      onMouseUp={() => setLifted(false)}
      onMouseLeave={() => setLifted(false)}
      onTouchStart={() => setLifted(true)}
      onTouchEnd={() => setLifted(false)}
      className={`relative inline-flex h-8 w-14 shrink-0 items-center rounded-full p-1 transition-colors duration-300 select-none ${
        disabled ? "opacity-40 cursor-not-allowed" : "cursor-pointer"
      } ${
        checked
          ? "bg-[#7A1F2D] border border-white/30"
          : "bg-black/20 dark:bg-white/15 border border-white/25"
      }`}
      style={{
        boxShadow: "inset 0 2px 4px rgba(0,0,0,0.25)"
      }}
    >
      <span
        style={{
          transform: `${checked ? "translateX(-24px)" : "translateX(0px)"} ${
            lifted ? "scale(1.22)" : "scale(1)"
          }`,
          transition: "transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), background 0.25s ease",
          backdropFilter: lifted ? "blur(4px) saturate(180%)" : undefined,
          boxShadow: lifted
            ? "0 6px 16px rgba(0,0,0,0.4), inset 0 1.5px 2px rgba(255,255,255,0.9)"
            : "0 2px 6px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.8)"
        }}
        className={`inline-block h-6 w-6 rounded-full ${lifted ? "bg-white/80" : "bg-white"}`}
      />
    </button>
  );
}

function Slider({
  value,
  min = 0,
  max = 100,
  step = 1,
  onValueChange,
  "aria-label": ariaLabel
}) {
  const [lifted, setLifted] = useState(false);
  const pct = Math.min(100, Math.max(0, ((value - min) / Math.max(1, max - min)) * 100));

  return (
    <div
      className="relative flex items-center w-full py-2 select-none"
      onMouseDown={() => setLifted(true)}
      onMouseUp={() => setLifted(false)}
      onTouchStart={() => setLifted(true)}
      onTouchEnd={() => setLifted(false)}
    >
      <div className="relative h-2.5 w-full rounded-full bg-black/20 dark:bg-white/15 overflow-hidden border border-white/20">
        <div
          className="h-full bg-gradient-to-l from-[#7A1F2D] to-[#b83248] rounded-full transition-all duration-150"
          style={{ width: `${pct}%` }}
        />
      </div>
      <input
        type="range"
        aria-label={ariaLabel}
        min={min}
        max={max}
        step={step}
        value={value}
        onChange={(e) => onValueChange(Number(e.target.value))}
        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
      />
      <div
        aria-hidden="true"
        style={{
          right: `calc(${pct}% - 12px)`,
          transform: lifted ? "scale(1.32)" : "scale(1)",
          transition: "transform 0.22s cubic-bezier(0.22, 1, 0.36, 1)",
          backdropFilter: "blur(6px) saturate(180%)",
          boxShadow: lifted
            ? "0 8px 20px rgba(0,0,0,0.45), inset 0 1.5px 2px rgba(255,255,255,0.9)"
            : "0 3px 8px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.85)"
        }}
        className="pointer-events-none absolute h-6 w-6 rounded-full bg-white/90 border border-white"
      />
    </div>
  );
}

function Input({
  type = "text",
  placeholder = "",
  icon = null,
  value,
  onValueChange,
  "aria-label": ariaLabel,
  className = ""
}) {
  return (
    <div
      style={{
        backdropFilter: "blur(8px) saturate(160%)",
        WebkitBackdropFilter: "blur(8px) saturate(160%)",
        boxShadow: "inset 0 1px 2px rgba(0,0,0,0.12), 0 1px 1px rgba(255,255,255,0.2)"
      }}
      className={`flex items-center gap-2.5 rounded-2xl px-3.5 py-2.5 border border-white/30 dark:border-white/15 bg-white/25 dark:bg-white/10 focus-within:border-[#7A1F2D] transition-all ${className}`}
    >
      {icon && <span className="text-neutral-500 dark:text-neutral-300 shrink-0">{icon}</span>}
      <input
        type={type}
        aria-label={ariaLabel}
        placeholder={placeholder}
        value={value}
        onChange={(e) => onValueChange(e.target.value)}
        className="w-full bg-transparent text-sm font-medium focus:outline-none placeholder:text-neutral-500 dark:placeholder:text-neutral-400"
      />
    </div>
  );
}

function Menu({ items = [], "aria-label": ariaLabel, triggerLabel = null }) {
  const [open, setOpen] = useState(false);

  return (
    <div className="relative inline-block text-right">
      <button
        type="button"
        aria-label={ariaLabel}
        onClick={() => setOpen((o) => !o)}
        className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-white/25 bg-white/15 dark:bg-white/10 hover:bg-white/25 text-xs font-bold backdrop-blur-md cursor-pointer"
      >
        {triggerLabel || <MoreVertical className="w-4 h-4" />}
      </button>
      {open && (
        <>
          <div className="fixed inset-0 z-40" onClick={() => setOpen(false)} />
          <div
            style={{
              backdropFilter: "blur(16px) saturate(190%)",
              WebkitBackdropFilter: "blur(16px) saturate(190%)",
              boxShadow:
                "0 20px 40px -10px rgba(0,0,0,0.5), inset 0 1px 1.5px rgba(255,255,255,0.4)"
            }}
            className="absolute left-0 mt-2 w-48 z-50 rounded-2xl p-1.5 border border-white/30 dark:border-white/20 bg-white/85 dark:bg-neutral-900/90 space-y-0.5"
          >
            {items.map((item, idx) =>
              item === "separator" ? (
                <div key={`sep-${idx}`} className="my-1 h-px bg-black/10 dark:bg-white/15" />
              ) : (
                <button
                  key={item.label}
                  type="button"
                  onClick={() => {
                    setOpen(false);
                    item.onSelect && item.onSelect();
                  }}
                  className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-colors cursor-pointer ${
                    item.destructive
                      ? "text-red-600 dark:text-red-400 hover:bg-red-500/15"
                      : "text-neutral-800 dark:text-neutral-100 hover:bg-black/10 dark:hover:bg-white/15"
                  }`}
                >
                  <span>{item.label}</span>
                  {item.icon && <span>{item.icon}</span>}
                </button>
              )
            )}
          </div>
        </>
      )}
    </div>
  );
}

    smsNotify: true,
    vipPriority: true
  });

  // Admin Panel State + 1-Click GitHub Direct Push Engine
  const [adminSubTab, setAdminSubTab] = useState("github"); // "github" | "dashboard" | "bookings" | "services" | "settings"
  const [adminCommissionRate, setAdminCommissionRate] = useState(10);
  const [adminReferralBonusAmount, setAdminReferralBonusAmount] = useState(150000);
  const [adminReferralCouponPct, setAdminReferralCouponPct] = useState(30);
  const [newServiceTitle, setNewServiceTitle] = useState("");
  const [newServicePrice, setNewServicePrice] = useState("");

  // Live GitHub Direct Push State (Runs in the user's browser to push to MathewWasHere/ClickFinal)
  const [ghToken, setGhToken] = useState("");
  const [ghSourceRepo, setGhSourceRepo] = useState("MathewWasHere/Clickv2");
  const [ghTargetRepo, setGhTargetRepo] = useState("MathewWasHere/ClickFinal");
  const [ghPushStatus, setGhPushStatus] = useState("idle"); // "idle" | "running" | "success" | "error"
  const [ghPushLogs, setGhPushLogs] = useState([]);

  // Toast Notification
  const [toast, setToast] = useState(null);
  const triggerToast = (msg, tone = "success") => {
    setToast({ msg, tone });
  };
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 4000);
    return () => clearTimeout(t);
  }, [toast]);

  // Computed booking pricing (with optional Express Facial add-on)
  const selectedService = useMemo(
    () => services.find((s) => s.id === bookingForm.serviceId) || services[0],
    [services, bookingForm.serviceId]
  );

  const selectedBarber = useMemo(
    () => BARBERS.find((b) => b.id === bookingForm.barberId) || BARBERS[0],
    [bookingForm.barberId]
  );

  const addonPrice = bookingForm.AddonFacial ? 250000 : 0;
  const totalServiceWithAddon = selectedService.price + addonPrice;
  const depositWithAddon = selectedService.deposit + (bookingForm.AddonFacial ? 80000 : 0);

  const basePayable =
    bookingForm.payMode === "deposit" ? depositWithAddon : totalServiceWithAddon;

  const couponDiscountAmount = useMemo(() => {
    if (!appliedCoupon) return 0;
    if (appliedCoupon.type === "percent") {
      const raw = Math.round((basePayable * appliedCoupon.value) / 100);
      return Math.min(raw, appliedCoupon.maxDiscount || raw);
    }
    return Math.min(basePayable, appliedCoupon.value);
  }, [appliedCoupon, basePayable]);

  const afterCouponAmount = Math.max(0, basePayable - couponDiscountAmount);
  const maxUsableWallet = Math.min(walletBalance, afterCouponAmount);

  useEffect(() => {
    setWalletSliderAmount((prev) => Math.min(prev, maxUsableWallet));
  }, [maxUsableWallet]);

  const effectiveWalletDeduction = useWalletAtCheckout
    ? Math.min(walletSliderAmount, maxUsableWallet)
    : 0;

  const finalGatewayPayable = Math.max(0, afterCouponAmount - effectiveWalletDeduction);

  // Ambassador Tier Progress based on invited friends count
  const referralCount = invitedFriends.length;
  const ambassadorTier = useMemo(() => {
    if (referralCount >= 5) {
      return { name: "سفیر رویال (Royal VIP)", cashbackPct: 10, nextTarget: 10, progress: 100 };
    }
    if (referralCount >= 2) {
      return {
        name: "سفیر طلایی (Gold)",
        cashbackPct: 7,
        nextTarget: 5,
        progress: Math.round((referralCount / 5) * 100)
      };
    }
    return {
      name: "سفیر نقره‌ای (Silver)",
      cashbackPct: 5,
      nextTarget: 2,
      progress: Math.round((referralCount / 2) * 100)
    };
  }, [referralCount]);

  const earnedCashback = Math.round(
    (totalServiceWithAddon * ambassadorTier.cashbackPct) / 100
  );

  // Filtered services
  const filteredServices = useMemo(() => {
    return services.filter((s) => {
      const matchesCat = s.category === serviceCategory;
      const matchesSearch =
        !searchQuery.trim() ||
        s.title.includes(searchQuery.trim()) ||
        s.shortDesc.includes(searchQuery.trim());
      return matchesCat && matchesSearch;
    });
  }, [services, serviceCategory, searchQuery]);

  const toggleFavorite = (id) => {
    setFavoriteServices((prev) =>
      prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
    );
  };

  // Handlers
  const handleCopyReferral = () => {
    const shareUrl = `https://clickfinal.pages.dev/?ref=${referralCode}`;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl);
      } else {
        const el = document.createElement("textarea");
        el.value = shareUrl;
        document.body.appendChild(el);
        el.select();
        document.execCommand("copy");
        document.body.removeChild(el);
      }
    } catch (e) {
      // ignore clipboard restriction
    }
    setCopiedRef(true);
    triggerToast(`لینک دعوت (${referralCode}) کپی شد!`);
    setTimeout(() => setCopiedRef(false), 2500);
  };

  const handleSimulateFriendInvite = (e) => {
    e.preventDefault();
    const fName = friendNameInput.trim() || "مهدی کریمی";
    const fPhone = friendPhoneInput.trim() || "0917•••3310";
    const bonus = adminReferralBonusAmount;
    const generatedCouponCode = `REF${Math.floor(100 + Math.random() * 900)}`;

    const newFriend = {
      id: `r-${Date.now()}`,
      name: fName,
      phone: fPhone,
      date: "امروز · هم‌اکنون",
      status: "completed",
      inviterReward:
        referralRewardType === "coupon"
          ? `کد تخفیف ${adminReferralCouponPct}٪ (${generatedCouponCode})`
          : `+${formatToman(bonus)} تومان شارژ کیف پول`,
      friendReward:
        referralRewardType === "wallet"
          ? `${formatToman(bonus)} تومان هدیه کیف پول دوست`
          : `${formatToman(bonus)} تومان + کوپن ${adminReferralCouponPct}٪ (${generatedCouponCode})`
    };

    setInvitedFriends((prev) => [newFriend, ...prev]);

    if (referralRewardType !== "coupon") {
      setWalletBalance((b) => b + bonus);
      setWalletTransactions((prev) => [
        {
          id: `tx-${Date.now()}`,
          title: `پاداش دعوت دوطرفه (${fName})`,
          date: "امروز · هم‌اکنون",
          amount: bonus,
          type: "credit",
          badge: "معرفی دوستان"
        },
        ...prev
      ]);
    }

    if (referralRewardType !== "wallet") {
      setCoupons((prev) => [
        {
          code: generatedCouponCode,
          title: `کوپن دوطرفه دعوت ${fName}`,
          type: "percent",
          value: adminReferralCouponPct,
          maxDiscount: 600000,
          desc: `${adminReferralCouponPct}٪ تخفیف هدیه دعوت از ${fName} (قابل استفاده برای شما و دوستتان)`,
          used: false
        },
        ...prev
      ]);
    }

    setFriendNameInput("");
    setFriendPhoneInput("");
    triggerToast(
      `تبریک! ${fName} با کد دعوت شما عضو شد. هدیه دوطرفه به کیف پول و لیست کوپن‌های هر دو نفر اضافه شد!`
    );
  };

  const handleApplyCouponCode = (codeToApply) => {
    const clean = (codeToApply ?? couponInput).trim().toUpperCase();
    if (!clean) return;
    const found = coupons.find((c) => c.code.toUpperCase() === clean && !c.used);
    if (!found) {
      triggerToast("کد تخفیف معتبر نیست یا قبلاً استفاده شده است.", "error");
      return;
    }
    setAppliedCoupon(found);
    setCouponInput(found.code);
    triggerToast(`کد تخفیف ${found.code} (${found.title}) با موفقیت اعمال شد!`);
  };

  const handleCompletePayment = () => {
    if (paymentFailSim) {
      triggerToast("خطا در تراکنش درگاه زرین‌پال (شبیه‌سازی خطا فعال است).", "error");
      return;
    }

    const newBookingId = `BK-${Math.floor(405 + Math.random() * 90)}`;
    const newBooking = {
      id: newBookingId,
      serviceId: selectedService.id,
      serviceTitle:
        selectedService.title + (bookingForm.AddonFacial ? " + ماسک طلا VIP" : ""),
      barber: selectedBarber.name,
      date: `${bookingForm.day.toLocaleString("fa-IR")} آبان ۱۴۰۵`,
      time: bookingForm.time,
      total: totalServiceWithAddon,
      paid: basePayable,
      walletUsed: effectiveWalletDeduction,
      couponUsed: appliedCoupon ? appliedCoupon.code : null,
      couponSaved: couponDiscountAmount,
      gatewayPaid: finalGatewayPayable,
      cashbackEarned: earnedCashback,
      status: "confirmed",
      pinned: true
    };

    const netWalletChange = earnedCashback - effectiveWalletDeduction;
    setWalletBalance((prev) => Math.max(0, prev + netWalletChange));

    const newTxs = [];
    if (effectiveWalletDeduction > 0) {
      newTxs.push({
        id: `tx-debit-${Date.now()}`,
        title: `کسر از کیف پول بابت رزرو ${newBookingId}`,
        date: "امروز · هم‌اکنون",
        amount: -effectiveWalletDeduction,
        type: "debit",
        badge: "پرداخت رزرو"
      });
    }
    if (earnedCashback > 0) {
      newTxs.push({
        id: `tx-cb-${Date.now() + 1}`,
        title: `پاداش کش‌بک ${ambassadorTier.cashbackPct}٪ رزرو ${selectedService.title}`,
        date: "امروز · هم‌اکنون",
        amount: earnedCashback,
        type: "credit",
        badge: "کش‌بک وفاداری"
      });
    }
    if (newTxs.length > 0) {
      setWalletTransactions((prev) => [...newTxs, ...prev]);
    }

    if (appliedCoupon) {
      setCoupons((prev) =>
        prev.map((c) => (c.code === appliedCoupon.code ? { ...c, used: true } : c))
      );
      setAppliedCoupon(null);
      setCouponInput("");
    }

    setBookings((prev) => [newBooking, ...prev]);
    setLastConfirmedBooking(newBooking);
    setCheckoutStep("confirmation");
    triggerToast(
      `رزرو ${newBookingId} ثبت شد و ${formatToman(earnedCashback)} تومان کش‌بک به کیف پول شما واریز شد!`
    );
  };

  const handleTopUpWallet = (amount) => {
    setWalletBalance((b) => b + amount);
    setWalletTransactions((prev) => [
      {
        id: `tx-top-${Date.now()}`,
        title: "شارژ مستقیم کیف پول (زرین‌پال)",
        date: "امروز · هم‌اکنون",
        amount,
        type: "credit",
        badge: "شارژ حساب"
      },
      ...prev
    ]);
    triggerToast(`کیف پول شما به مبلغ ${formatToman(amount)} تومان شارژ شد!`);
  };

  // ==========================================================================
  // IN-BROWSER 1-CLICK GITHUB MIGRATION & PUSH ENGINE
  // Copies MathewWasHere/Clickv2 -> MathewWasHere/ClickFinal (Commit #1 Backup)
  // Then pushes the React + Glisse + Referral/Wallet app (Commit #2 Upgrade)
  // ==========================================================================
  const handleDirectGitHubPush = async () => {
    if (!ghToken.trim()) {
      triggerToast("لطفاً توکن کلاسیک گیت‌هاب را وارد کنید.", "error");
      return;
    }
    setGhPushStatus("running");
    setGhPushLogs(["⏳ شروع اتصال به GitHub API از مرورگر شما..."]);

    const appendLog = (line) => setGhPushLogs((prev) => [...prev, line]);

    const ghApi = async (pathUrl, options = {}) => {
      const res = await fetch(`https://api.github.com${pathUrl}`, {
        ...options,
        headers: {
          Authorization: `token ${ghToken.trim()}`,
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`HTTP ${res.status}: ${errText}`);
      }
      return res.json();
    };

    const toBase64Utf8 = (str) => {
      const bytes = new TextEncoder().encode(str);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    };

    try {
      appendLog(`📦 ۱. خواندن ساختار مخزن اصلی (${ghSourceRepo})...`);
      const srcBranch = await ghApi(`/repos/${ghSourceRepo}/branches/main`);
      const srcTreeSha = srcBranch.commit.commit.tree.sha;
      const srcTree = await ghApi(`/repos/${ghSourceRepo}/git/trees/${srcTreeSha}?recursive=1`);

      let targetRef;
      try {
        targetRef = await ghApi(`/repos/${ghTargetRepo}/git/ref/heads/main`);
      } catch (initErr) {
        appendLog(`🆕 مخزن ${ghTargetRepo} خالی است؛ در حال مقداردهی اولیه شاخه main...`);
        await ghApi(`/repos/${ghTargetRepo}/contents/README.md`, {
          method: "PUT",
          body: JSON.stringify({
            message: "Initialize ClickFinal repository",
            content: toBase64Utf8("# ClickFinal — Backup & Glisse Liquid Glass Upgrade\n")
          })
        });
        targetRef = await ghApi(`/repos/${ghTargetRepo}/git/ref/heads/main`);
      }

      appendLog(
        `🛡️ ۲. کپی ۱ به ۱ تمامی فایل‌های ${ghSourceRepo} به عنوان Commit #1 (نسخه پشتیبان)...`
      );
      const backupTreeEntries = [];
      for (const item of srcTree.tree) {
        if (item.type !== "blob") continue;
        const blobData = await ghApi(`/repos/${ghSourceRepo}/git/blobs/${item.sha}`);
        const newBlob = await ghApi(`/repos/${ghTargetRepo}/git/blobs`, {
          method: "POST",
          body: JSON.stringify({
            content: blobData.content,
            encoding: blobData.encoding
          })
        });
        backupTreeEntries.push({
          path: item.path,
          mode: item.mode,
          type: "blob",
          sha: newBlob.sha
        });
      }

      const backupTree = await ghApi(`/repos/${ghTargetRepo}/git/trees`, {
        method: "POST",
        body: JSON.stringify({ tree: backupTreeEntries })
      });

      const backupCommit = await ghApi(`/repos/${ghTargetRepo}/git/commits`, {
        method: "POST",
        body: JSON.stringify({
          message: "Backup: exact 1:1 copy of original MathewWasHere/Clickv2",
          tree: backupTree.sha,
          parents: [targetRef.object.sha]
        })
      });

      await ghApi(`/repos/${ghTargetRepo}/git/refs/heads/main`, {
        method: "PATCH",
        body: JSON.stringify({ sha: backupCommit.sha, force: true })
      });
      appendLog(`✅ کامیت پشتیبان (#1) با موفقیت در ${ghTargetRepo} ثبت شد!`);

      appendLog(
        `✨ ۳. ساخت و ارسال Commit #2 (اپلیکیشن جدید React + Glisse Liquid Glass + کیف پول و معرفی دوستان)...`
      );

      const pkgJson = JSON.stringify(
        {
          name: "click-final-glisse",
          private: true,
          version: "2.0.0",
          type: "module",
          scripts: {
            dev: "vite",
            build: "vite build",
            preview: "vite preview"
          },
          dependencies: {
            glisse: "^0.5.0",
            "lucide-react": "^0.468.0",
            react: "^18.3.1",
            "react-dom": "^18.3.1"
          },
          devDependencies: {
            "@tailwindcss/vite": "^4.0.0",
            "@vitejs/plugin-react": "^4.3.4",
            tailwindcss: "^4.0.0",
            vite: "^6.0.0"
          }
        },
        null,
        2
      );

      const viteConfig = `import { defineConfig } from "vite";\nimport react from "@vitejs/plugin-react";\nimport tailwindcss from "@tailwindcss/vite";\n\nexport default defineConfig({\n  plugins: [react(), tailwindcss()]\n});\n`;

      const indexHtml = ["<!doctype html>", "<html lang=\"fa\" dir=\"rtl\">", "  <head>", "    <meta charset=\"UTF-8\" />", "    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />", "    <meta name=\"theme-color\" content=\"#272727\" />", "    <title>پیرایش VIP | ClickFinal</title>", "  </head>", "  <body>", "    <div id=\"root\"></div>", "  </body>", "</html>"].join("\n");

      const mainJsx = "// Entry point generated for Vite build\n";

      const indexCss = `@import "tailwindcss";\n`;

      const readmeMd = `# ClickFinal — پیرایش VIP (Glisse Liquid Glass + Referral & Wallet)\n\n- **Commit #1**: Exact 1:1 backup of \`MathewWasHere/Clickv2\` (also preserved in \`backup-clickv2/\`).\n- **Commit #2**: Upgraded React + Vite + \`glisse\` Liquid Glass UI with Two-Way Referral & Digital Wallet.\n\n## Cloudflare Pages Configuration\n- **Framework preset**: Vite\n- **Build command**: \`npm run build\`\n- **Build output directory**: \`dist\`\n`;

      const wranglerJsonc = JSON.stringify(
        {
          name: "clickfinal",
          compatibility_date: "2025-04-01",
          assets: {
            directory: "."
          }
        },
        null,
        2
      );

      const liveStandaloneHtml = indexHtml;

      const filesToCreate = [
        { path: "wrangler.jsonc", content: wranglerJsonc },
        { path: "index.html", content: liveStandaloneHtml },
        { path: "public/index.html", content: liveStandaloneHtml },
        { path: "pages/barbershop-home.html", content: liveStandaloneHtml },
        { path: "package.json", content: pkgJson },
        { path: "vite.config.js", content: viteConfig },
        { path: "src/index.css", content: indexCss },
        { path: "src/main.jsx", content: mainJsx },
        { path: "README.md", content: readmeMd }
      ];

      const upgradeEntries = [
        ...backupTreeEntries.map((e) => ({
          ...e,
          path: e.path.startsWith("assets/")
            ? `public/${e.path}`
            : `backup-clickv2/${e.path}`
        }))
      ];

      for (const f of filesToCreate) {
        const isStandaloneHtml = f.path.endsWith(".html");
        const b = await ghApi(`/repos/${ghTargetRepo}/git/blobs`, {
          method: "POST",
          body: JSON.stringify({
            content: toBase64Utf8(f.content),
            encoding: "base64"
          })
        });
        upgradeEntries.push({
          path: f.path,
          mode: "100644",
          type: "blob",
          sha: b.sha
        });
      }

      const upgradeTree = await ghApi(`/repos/${ghTargetRepo}/git/trees`, {
        method: "POST",
        body: JSON.stringify({ tree: upgradeEntries })
      });

      const upgradeCommit = await ghApi(`/repos/${ghTargetRepo}/git/commits`, {
        method: "POST",
        body: JSON.stringify({
          message:
            "Feat: Upgrade to React + Glisse Liquid Glass UI & add Referral + Digital Wallet system",
          tree: upgradeTree.sha,
          parents: [backupCommit.sha]
        })
      });

      await ghApi(`/repos/${ghTargetRepo}/git/refs/heads/main`, {
        method: "PATCH",
        body: JSON.stringify({ sha: upgradeCommit.sha, force: true })
      });

      appendLog(
        `🎉 کامیت ارتقاء (#2) با موفقیت روی شاخه main مخزن ${ghTargetRepo} پوش شد! اکنون می‌توانید مخزن ClickFinal را مستقیم به Cloudflare Pages متصل کنید.`
      );
      setGhPushStatus("success");
      triggerToast(`مخزن ${ghTargetRepo} با موفقیت کامل (بکاپ + نسخه جدید) آپدیت شد!`);
    } catch (err) {
      appendLog(`❌ خطا: ${err.message}`);
      setGhPushStatus("error");
      triggerToast("خطا در ارتباط با GitHub API؛ جزئیات را در کادر لاگ ببینید.", "error");
    }
  };

  const glassStyle = {
    "--lg-glass-bend": glassConfig.bend,
    "--lg-glass-dispersion": glassConfig.dispersion,
    "--lg-blur": `${glassConfig.blur}px`,
    "--lg-rim-shine": glassConfig.rimShine
  };

  return (
    <div
      dir="rtl"
      lang="fa"
      data-theme={theme}
      className={`${
        theme === "dark" ? "dark bg-[#111113] text-[#F9F8F2]" : "bg-[#F4F1EA] text-[#272727]"
      } min-h-screen font-sans relative selection:bg-[#7A1F2D] selection:text-white transition-colors duration-500`}
      style={{ fontFamily: "'Vazirmatn', 'IRANSansX', system-ui, sans-serif" }}
    >
      <GlisseSvgFilters bend={glassConfig.bend} dispersion={glassConfig.dispersion} />

      {/* ====================================================================
          DATA-GLISSE-BACKDROP: Rich atmospheric background so Liquid Glass
          refracts real light, burgundy/gold glows, and geometric barber poles
         ==================================================================== */}
      <div
        data-glisse-backdrop
        className="fixed inset-0 pointer-events-none overflow-hidden z-0"
      >
        <div
          className={`absolute inset-0 transition-opacity duration-700 ${
            theme === "dark" ? "opacity-100" : "opacity-30"
          }`}
          style={{
            background:
              "radial-gradient(circle at 18% 15%, rgba(122, 31, 45, 0.58) 0%, transparent 48%), radial-gradient(circle at 82% 28%, rgba(212, 163, 89, 0.30) 0%, transparent 45%), radial-gradient(circle at 50% 85%, rgba(122, 31, 45, 0.45) 0%, transparent 55%)"
          }}
        />
        <div className="absolute -top-24 -right-24 w-96 h-96 rounded-full border border-[#7A1F2D]/30 blur-[1px]" />
        <div className="absolute top-1/3 -left-20 w-80 h-80 rounded-full bg-gradient-to-tr from-[#7A1F2D]/25 via-amber-500/15 to-transparent blur-2xl" />
        <div className="absolute bottom-16 right-1/4 w-72 h-72 rounded-full bg-gradient-to-bl from-rose-800/25 via-amber-600/10 to-transparent blur-2xl" />
      </div>

      {/* Toast Notification */}
      {toast && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md">
          <Glass
            style={{ ...glassStyle, "--lg-blur": "12px" }}
            className={`rounded-2xl px-4 py-3 border ${
              toast.tone === "error" ? "border-red-400/50" : "border-emerald-400/40"
            }`}
          >
            <div className="flex items-center justify-between gap-3">
              <div className="flex items-center gap-2.5 text-xs sm:text-sm font-bold">
                {toast.tone === "error" ? (
                  <AlertCircle className="w-5 h-5 text-red-400 shrink-0" />
                ) : (
                  <CheckCircle2 className="w-5 h-5 text-emerald-400 shrink-0" />
                )}
                <span>{toast.msg}</span>
              </div>
              <button
                type="button"
                onClick={() => setToast(null)}
                className="text-xs opacity-70 hover:opacity-100 cursor-pointer"
              >
                بستن
              </button>
            </div>
          </Glass>
        </div>
      )}

      {/* QR Code Invite Modal */}
      {showQrModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-sm">
          <Glass

            { value: "home", label: "خانه", icon: <Home className="w-4 h-4" /> },
            { value: "services", label: "خدمات", icon: <Scissors className="w-4 h-4" /> },
            { value: "booking", label: "رزرو نوبت", icon: <Calendar className="w-4 h-4" /> },
            { value: "wallet", label: "کیف پول و هدیه", icon: <Gift className="w-4 h-4" /> },
            { value: "profile", label: "نوبت‌های من", icon: <User className="w-4 h-4" /> }
          ]}
          value={activeTab === "admin" ? "home" : activeTab}
          onValueChange={(val) => {
            setActiveTab(val);
          }}
        />
      </div>
    </div>
  );
}

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
